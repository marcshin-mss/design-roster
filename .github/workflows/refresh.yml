name: 대시보드 갱신

on:
  schedule:
    - cron: "*/30 22,23 * * 0-4"       # 평일 07:00~08:30 KST
    - cron: "*/30 0-13 * * 1-5"        # 평일 09:00~22:30 KST
  workflow_dispatch:                    # Actions 탭에서 수동 실행
  push:
    branches: [main]                        # main 에 뭘 올리든 다시 빌드하고 배포한다
                                            # (paths 를 걸면 index.html·app.enc 를 고쳐도 배포가 안 된다)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography
      - name: 지라에서 읽어 data.json 생성
        env:
          JIRA_BASE:  ${{ secrets.JIRA_BASE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          GATE_PASS:  ${{ secrets.GATE_PASS }}
        run: python build.py
      - name: 변경분 커밋
        run: |
          git config user.name  "roster-bot"
          git config user.email "roster-bot@users.noreply.github.com"
          git add -A data.json taxonomy.enc basis.enc slack.enc one.enc
          git diff --staged --quiet || git commit -m "갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
      - uses: actions/deploy-pages@v4
