name: 대시보드 갱신

on:
  schedule:
    - cron: "0 22 * * 0-4"             # 평일 07:00 KST
    - cron: "0 1,4,7,10,13 * * 1-5"    # 평일 10·13·16·19·22시 KST (3시간 간격, Marc 2026-10-02)
    - cron: "0 11 * * 5"               # 금 20:00 KST — 주간 사이즈 스냅샷 확정
  workflow_dispatch:                    # Actions 탭에서 수동 실행
  push:
    branches: [main]                        # main 에 뭘 올리든 다시 빌드하고 배포한다
                                            # (paths 를 걸면 index.html·app.enc 를 고쳐도 배포가 안 된다)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography
      - name: 주간 스냅샷 판단 (금 20시 KST)
        run: |
          KD=$(TZ=Asia/Seoul date +%u)   # 1=월 … 7=일
          KH=$(TZ=Asia/Seoul date +%H)   # 00…23
          if [ "$KD" = "5" ] && [ "$KH" = "20" ]; then
            echo "SNAP_WEEK=1" >> "$GITHUB_ENV"
            echo "금 20시 KST — 이번 실행에서 주간 사이즈 스냅샷을 남깁니다."
          else
            echo "일반 갱신 (요일=$KD 시각=$KH KST) — 사이즈 스냅샷 없음"
          fi
      - name: 지라에서 읽어 data.json 생성
        env:
          JIRA_BASE:  ${{ secrets.JIRA_BASE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          GATE_PASS:  ${{ secrets.GATE_PASS }}
          PXD_LEAVE_ICAL: ${{ secrets.PXD_LEAVE_ICAL }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}   # #one-제품디자인실 읽기 전용 봇 (없으면 스냅샷)
        run: python build.py
      - name: 변경분 커밋
        id: commit
        run: |
          git config user.name  "roster-bot"
          git config user.email "roster-bot@users.noreply.github.com"
          git add -A data.json taxonomy.enc basis.enc slack.enc one.enc app.enc
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            # 그 사이 원격이 앞서 있으면 붙여서 올린다.
            # 충돌(다른 빌드가 먼저 data.json 을 올림)이면 되돌리고 이번 배포는 건너뛴다 —
            # 원격의 더 새 커밋을 빌드하는 실행이 따로 배포한다. (2026-10-02: 충돌 표시가 섞인 data.json 이 배포된 사고 방지)
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
              git push || { echo "::warning::푸시 실패 — 이번 배포는 건너뜁니다"; echo "skip=1" >> "$GITHUB_OUTPUT"; }
            else
              git rebase --abort || true
              echo "::warning::원격과 충돌 — 이번 결과는 버리고 배포를 건너뜁니다"
              echo "skip=1" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: 배포 전 파일 검사
        if: steps.commit.outputs.skip != '1'
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          for f in ["data.json", "sync.json"] + glob.glob("*.enc"):
              t = open(f, encoding="utf-8").read()
              if "<<<<<<<" in t or ">>>>>>>" in t:
                  bad.append(f + " (충돌 표시)"); continue
              try:
                  json.loads(t)
              except Exception as e:
                  bad.append(f"{f} ({e})")
          if bad:
              sys.exit("배포 중단 — 깨진 파일: " + ", ".join(bad))
          print("파일 검사 통과")
          PY
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.skip != '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.skip != '1'
        with: { path: "." }
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.skip != '1'
