name: 워커 배포
# 리포의 worker.js 가 바뀌면 Cloudflare Worker(design-roster-sync)에 올린다 (Marc 2026-11-04 「로그인 연결 없이」).
# Cloudflare API 토큰(Workers 스크립트 편집 권한)을 GitHub secret CF_API_TOKEN 에 넣어 두면 동작한다. 없으면 건너뛴다.
# 대시보드 API 와 같은 엔드포인트(content PUT)라 KV · 시크릿 바인딩은 그대로 유지된다.

on:
  push:
    branches: [main]
    paths: [worker.js]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ACC: 324962e888d9383426978af3afa5ef78
      API: https://api.cloudflare.com/client/v4/accounts/324962e888d9383426978af3afa5ef78/workers/scripts/design-roster-sync
    steps:
      - uses: actions/checkout@v4
      - name: 워커 코드 올리기
        run: |
          if [ -z "$CF_API_TOKEN" ]; then echo "::warning::CF_API_TOKEN 시크릿이 없어 워커 배포를 건너뜁니다"; exit 0; fi
          # 붙여 넣을 때 섞인 공백 · 줄바꿈 · 'Authorization: Bearer' 문구는 걷어 낸다
          T=$(printf '%s' "$CF_API_TOKEN" | tr -d '\r' | sed -n 's/.*Bearer[[:space:]]*\([^[:space:]"]*\).*/\1/p' | head -1)
          [ -n "$T" ] || T=$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$T"
          echo "토큰 길이 ${#T}"
          curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $T" > /tmp/r0.json
          python3 -c "import json;j=json.load(open('/tmp/r0.json'));print('verify:', (j.get('result') or {}).get('status') if j.get('success') else j.get('errors'))"
          cp worker.js /tmp/w.mjs && node --check /tmp/w.mjs
          curl -sS -X PUT "$API/content" -H "Authorization: Bearer $T" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@worker.js;type=application/javascript+module' > /tmp/r1.json
          python3 -c "import json,sys;j=json.load(open('/tmp/r1.json'));print('content:', 'ok' if j.get('success') else j.get('errors'));sys.exit(0 if j.get('success') else 1)"
          curl -sS -X PUT "$API/schedules" -H "Authorization: Bearer $T" -H 'content-type: application/json' \
            -d '[{"cron":"*/5 0-11 * * 1-5"}]' > /tmp/r2.json
          python3 -c "import json,sys;j=json.load(open('/tmp/r2.json'));print('schedules:', 'ok' if j.get('success') else j.get('errors'));sys.exit(0 if j.get('success') else 1)"
