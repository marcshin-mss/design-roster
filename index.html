/* Vercel Geist — Background 1/2, gray 100·200·400·700·900·1000, Blue 700, Red 800
   도메인 10색은 Geist가 규정하지 않는 범주형 팔레트라 색각 검증을 거친 자체 스케일을 유지 */
:root{
  color-scheme:light;
  --bg1:#ffffff; --bg2:#fafafa;
  --g100:#f2f2f2; --g200:#ebebeb; --g400:#d9d9d9; --g600:#8f8f8f;
  --g800:#666666; --g900:#4d4d4d; --g1000:#171717;
  --plane:var(--bg2); --surface:var(--bg1); --sunk:#fbfbfb; --band:var(--g100);
  --ink:var(--g1000); --ink-2:var(--g900); --ink-3:var(--g800);
  --rule:var(--g200); --rule-2:var(--g400);
  --accent:#0070f3; --focus:#0070f3; --warn:#e5484d; --orange:#d9560b; --ok:#0e8f63;
  --r-sm:4px; --r-md:6px;
  --t1:#2a78d6; --t2:#eb6834; --t3:#1baf7a; --t4:#eda100;
  --t5:#e87ba4; --t6:#008300; --t7:#4a3aa7; --t8:#e34948;
  --t9:#0f96b4; --t10:#b53bb0; --t11:#0b6e99; --t12:#a8a69a; --t13:#7a8f2f; --t14:#8a5a2b; --t15:#c2410c;
  --sw:min(460px,38vw);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg1:#000000; --bg2:#0a0a0a;
    --g100:#1a1a1a; --g200:#1f1f1f; --g400:#2e2e2e; --g600:#878787;
    --g800:#a1a1a1; --g900:#ededed; --g1000:#ffffff;
    --plane:var(--bg1); --surface:#0a0a0a; --sunk:#111111; --band:var(--g100);
    --ink:var(--g900); --ink-2:#a1a1a1; --ink-3:#878787;
    --rule:#242424; --rule-2:var(--g400);
    --accent:#3291ff; --focus:#3291ff; --warn:#ff6369; --orange:#f77d26; --ok:#199e70;
    --t1:#3987e5; --t2:#e0602c; --t3:#199e70; --t4:#c98500;
    --t5:#d55181; --t6:#25963a; --t7:#9085e9; --t8:#e66767;
    --t9:#2aa6c2; --t10:#c85ec2; --t11:#3d92bd; --t12:#8b897d; --t13:#98ad4a; --t14:#b98351; --t15:#f0844a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg1:#000000; --bg2:#0a0a0a;
  --g100:#1a1a1a; --g200:#1f1f1f; --g400:#2e2e2e; --g600:#878787;
  --g800:#a1a1a1; --g900:#ededed; --g1000:#ffffff;
  --plane:var(--bg1); --surface:#0a0a0a; --sunk:#111111; --band:var(--g100);
  --ink:var(--g900); --ink-2:#a1a1a1; --ink-3:#878787;
  --rule:#242424; --rule-2:var(--g400);
  --accent:#3291ff; --focus:#3291ff; --warn:#ff6369; --orange:#f77d26; --ok:#199e70;
  --t1:#3987e5; --t2:#e0602c; --t3:#199e70; --t4:#c98500;
  --t5:#d55181; --t6:#25963a; --t7:#9085e9; --t8:#e66767;
    --t9:#2aa6c2; --t10:#c85ec2; --t11:#3d92bd; --t12:#8b897d; --t13:#98ad4a; --t14:#b98351; --t15:#f0844a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:Pretendard,system-ui,sans-serif;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font-family:inherit}

/* ── 밀어내는 레이아웃 ── */
.app{transition:padding-right .28s cubic-bezier(.22,.61,.36,1)}
body.sheet-on .app{padding-right:var(--sw)}

/* ── 탭 ── */
.tabs{display:inline-flex;gap:2px;background:var(--band);border-radius:var(--r-md);padding:2px}
.tab{font-size:12.5px;font-weight:600;color:var(--ink-2);background:transparent;border:0;
  border-radius:var(--r-sm);padding:4px 13px;cursor:pointer;line-height:1.5;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--g1000);color:var(--bg1);font-weight:600}
[hidden]{display:none!important}

/* ── ONE : design-driven 칸반 ── */
.obar{position:sticky;top:var(--r1H,52px);z-index:30;display:flex;flex-flow:row wrap;column-gap:20px;row-gap:8px;align-items:center;
  padding:13px 20px 14px;background:var(--surface);border-bottom:1px solid var(--rule-2);
  transition:transform .24s cubic-bezier(.22,.61,.36,1),opacity .16s linear}
body.fold .obar{transform:translateY(calc(-100% - 4px));opacity:0;pointer-events:none}
.obar .r{position:relative;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.obar .r+.r::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);height:14px;width:1px;background:var(--rule-2)}
.osearch{flex:0 1 260px;font:inherit;font-size:12px;color:var(--ink);background:var(--sunk);
  border:1px solid var(--rule);border-radius:var(--r-sm);padding:4px 10px}
.osearch::placeholder{color:var(--ink-3)}
.osel{font:inherit;font-size:12px;color:var(--ink);background:var(--sunk);
  border:1px solid var(--rule);border-radius:var(--r-sm);padding:4px 9px}
.ocount{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-left:5px}
.ocount b{color:var(--ink);font-weight:600;font-size:13.5px}
.ojira{margin-left:auto;font-size:11.5px;color:var(--ink-2);text-decoration:none;
  border:1px solid var(--rule);border-radius:var(--r-sm);padding:4px 11px;white-space:nowrap}
.ojira:hover{border-color:var(--g600);color:var(--ink)}

.kb{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:1px;
  background:var(--rule);border-bottom:1px solid var(--rule-2);align-items:stretch}
.kcol{background:var(--plane);min-width:0;padding-bottom:18px;display:flex;flex-direction:column}
.kcol .kbody{flex:1 1 auto}
.khead{flex:0 0 auto;position:sticky;top:calc(var(--r1H,52px) + var(--obarH,84px));z-index:20;display:flex;align-items:baseline;gap:8px;
  background:var(--band);border-bottom:1px solid var(--rule-2);padding:8px 14px;
  transition:top .24s cubic-bezier(.22,.61,.36,1)}
body.fold .khead{top:var(--r1H,52px)}
.khead h3{margin:0;font-size:13px;font-weight:700;letter-spacing:-.02em}
.khead span{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.kcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  margin:7px 11px 0;padding:10px 12px 9px;display:block;text-decoration:none;color:inherit}
.kcard:hover{border-color:var(--g600)}
.kcard .t{font-size:12.5px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.kcard .m{display:flex;align-items:center;gap:6px;margin-top:8px}
.kcard .k{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kcard .who{margin-left:auto;font-size:10.5px;color:var(--ink-3)}
.ki{width:13px;height:13px;border-radius:3px;border:1.5px solid currentColor;flex:0 0 auto}
.ki.ini{color:#e5484d}.ki.epi{color:#8e4ec6}.ki.sto{color:#2f9e44}
.kmore{display:block;width:calc(100% - 22px);margin:7px 11px 0;padding:6px;font:inherit;font-size:11.5px;
  color:var(--ink-2);background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-sm);cursor:pointer}
.kmore:hover{border-color:var(--g600);color:var(--ink)}
.kdry{padding:12px 14px;font-size:11.5px;color:var(--ink-3)}
@media (max-width:1100px){.kb{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}}

/* ── 도메인별 / 성격별 : 집계 뷰 ── */
.gwrap{padding:20px 20px 0}
.glede{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin:0 0 14px}
.kpibox{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 14px}
.kpicard{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:14px 16px 15px;overflow:hidden}
.kpicard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--accent))}
.kpicard .kl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em}
.kpicard .kl i{width:9px;height:9px;border-radius:2px;background:var(--kc,var(--accent));flex:0 0 auto}
.kpicard .kv{display:block;margin:8px 0 0;font-family:Pretendard,system-ui,sans-serif;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.kpicard .kv small{font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.kpicard .ks{display:block;margin-top:8px;font-size:11px;color:var(--ink-3);line-height:1.55}
.kpicard .ks b{color:var(--ink-2);font-weight:600}
.kpinote{font-size:11.5px;color:var(--ink-3);line-height:1.6;background:var(--band);border-radius:var(--r-sm);padding:10px 12px;margin:0 0 8px}
.planbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;background:var(--band);border-bottom:1px solid var(--rule-2);font-size:12px}
.planbar label{color:var(--ink-2);font-weight:600}
.planbar input{width:74px;font:inherit;font-size:12px;text-align:right;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-sm);padding:3px 8px;font-variant-numeric:tabular-nums}
.planbar .psum{color:var(--ink-3);font-variant-numeric:tabular-nums}
.planbar .psum b{color:var(--ink);font-weight:600}
.planbar .pbtn{font:inherit;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-sm);padding:4px 11px;cursor:pointer;white-space:nowrap}
.planbar .pbtn:hover{border-color:var(--g600);color:var(--ink)}
.planbar .sp{margin-left:auto}
.kcard .kmeta{display:flex;align-items:center;gap:6px;margin-top:7px}
.kpri{font-size:9.5px;font-weight:700;color:#fff;background:var(--pc,var(--accent));border-radius:3px;padding:1px 6px;cursor:pointer;letter-spacing:.02em}
.ksz{font-size:9.5px;font-weight:700;color:var(--ink-2);border:1px solid var(--rule-2);border-radius:3px;padding:1px 6px;cursor:pointer;font-variant-numeric:tabular-nums}
.kcard.over{opacity:.5}
.cutline{display:flex;align-items:center;gap:8px;margin:11px 2px;font-size:10px;font-weight:700;color:var(--warn);letter-spacing:.02em;white-space:nowrap}
.cutline::before,.cutline::after{content:"";height:1px;background:var(--warn);flex:1;opacity:.45}
.ppreview{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);margin:12px 20px;padding:12px 14px;font-size:11.5px;line-height:1.6;color:var(--ink-2);max-height:320px;overflow:auto}
.ppreview h4{margin:0 0 8px;font-size:12.5px;color:var(--ink)}
.ppreview .row{padding:6px 0;border-top:1px solid var(--rule)}
.ppreview .row b{color:var(--ink)}
.ppreview .lab{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:3px;padding:0 5px;margin:0 3px 0 0}
.glede b{color:var(--ink);font-weight:600}
/* ── FT 흐름 : 차트 ── */
:root{--c-in:#0070f3; --c-done:#0e8f63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-in:#3291ff; --c-done:#199e70}}
:root[data-theme="dark"]{--c-in:#3291ff; --c-done:#199e70}
.cw{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:14px 16px 10px;margin:0 0 14px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ch h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.ch h3 span{margin-left:8px;font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.chn{font-family:Pretendard,system-ui,sans-serif;font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:12px}
.chn b{color:var(--ink);font-weight:700;font-size:13px}
.chn i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
.cbody{position:relative}
.cbody svg{display:block;width:100%;height:auto}
.cbody .gl{stroke:var(--rule);stroke-width:1}
.cbody .ax{fill:var(--ink-3);font-size:9.5px;font-family:Pretendard,system-ui,sans-serif}
.cbody .ax.wn{font-size:8.5px;opacity:.75}
.cbody .vl{fill:var(--ink);font-size:12px;font-weight:700;font-family:Pretendard,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.cbody rect.b{shape-rendering:crispEdges}
.cbody .hit{fill:transparent;cursor:pointer}
.cbody .hit:hover~.hl,.cbody .hl.on{opacity:1}
.cbody .ma{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cttip{position:absolute;pointer-events:none;z-index:5;background:var(--g1000);color:var(--bg1);
  border-radius:var(--r-sm);padding:6px 9px;font-size:11px;line-height:1.55;white-space:nowrap;
  opacity:0;transition:opacity .1s;font-variant-numeric:tabular-nums}
.cttip b{font-weight:700}
.cttip em{font-style:normal;opacity:.7}
.cbody .hit{fill:transparent;cursor:pointer}
.cbody .hit:hover{fill:var(--ink);fill-opacity:.05}
.crd{margin-top:8px;padding:7px 10px;border-top:1px solid var(--rule);font-size:11.5px;
  color:var(--ink-2);font-variant-numeric:tabular-nums;min-height:31px;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap}
.crd b{color:var(--ink);font-weight:700}
.crd .mut{color:var(--ink-3)}
.crd .cta{margin-left:auto;color:var(--accent);font-size:11px}
.ltab{display:flex;gap:2px;background:var(--band);border-radius:var(--r-md);padding:2px;margin:0 0 12px;width:fit-content}
.ltab button{font:inherit;font-size:11.5px;font-weight:600;color:var(--ink-3);background:transparent;border:0;
  border-radius:var(--r-sm);padding:4px 13px;cursor:pointer;white-space:nowrap}
.ltab button:hover{color:var(--ink)}
.ltab button[aria-selected="true"]{background:var(--g1000);color:var(--bg1)}
.lgrp{margin:0 0 2px}
.lday{position:sticky;top:0;background:var(--surface);z-index:1;display:flex;align-items:baseline;gap:8px;
  padding:7px 0 5px;font-family:Pretendard,system-ui,sans-serif;font-size:10.5px;letter-spacing:.06em;
  color:var(--ink-3);border-bottom:1px solid var(--rule-2)}
.lday b{color:var(--ink-2);font-size:11.5px;letter-spacing:0}
.lrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule);
  text-decoration:none;color:inherit}
.lrow:hover .lt{border-bottom-color:var(--ink-3)}
.lrow .lk{font-family:Pretendard,system-ui,sans-serif;font-size:10.5px;color:var(--ink-3);
  flex:0 0 auto;min-width:62px;font-variant-numeric:tabular-nums}
.lrow .lt{font-size:12.5px;line-height:1.5;flex:1 1 auto;min-width:0;border-bottom:1px solid transparent}
.lrow .lm{flex:0 0 auto;font-size:10.5px;color:var(--ink-3);text-align:right;line-height:1.5}
.lrow .lm b{display:block;color:var(--ink-2);font-weight:600;font-size:11px}
.lrow .ls{flex:0 0 auto;font-size:9.5px;font-weight:700;color:var(--ink-3);border:1px solid var(--rule-2);
  border-radius:3px;padding:0 5px;line-height:1.5}
.lwrap{max-height:520px;overflow:auto;padding-right:4px}
.ldry{padding:18px 0;font-size:12px;color:var(--ink-3)}
.slit{padding:12px 0;border-bottom:1px solid var(--rule)}
.slh{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px}
.slh b{font-weight:700;font-size:12px}
.sld{font-family:Pretendard,system-ui,sans-serif;font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.slh .mut,.slj .mut{color:var(--ink-3);font-size:10.5px}
.slt{margin-top:5px;font-size:12.5px;line-height:1.55}
.slj{margin-top:5px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.slj a{font-family:Pretendard,system-ui,sans-serif;font-size:10.5px;font-weight:700;color:var(--accent);
  text-decoration:none;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  border-radius:3px;padding:0 5px;line-height:1.6}
.slj a:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ftbl{margin:4px 0 0}
.ftbl summary{cursor:pointer;font-size:11.5px;color:var(--ink-2);padding:6px 0}
.ftbl table{border-collapse:collapse;width:100%;margin-top:8px;font-size:11.5px;
  font-variant-numeric:tabular-nums}
.ftbl th,.ftbl td{border-bottom:1px solid var(--rule);padding:4px 8px;text-align:right}
.ftbl th:first-child,.ftbl td:first-child{text-align:left}
.ftbl th{color:var(--ink-3);font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.ftw{max-height:340px;overflow:auto}
.kbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 16px}
.kb1{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:12px 14px 13px;overflow:hidden}
.kb1::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc)}
.kb1 .nm{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.kb1 .nm i{width:9px;height:9px;border-radius:3px;background:var(--kc);flex:0 0 auto}
.kb1 .pc{display:block;margin:6px 0 0;font-family:Pretendard,system-ui,sans-serif;
  font-size:32px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--kc);
  font-variant-numeric:tabular-nums}
.kb1 .sub{display:block;margin-top:7px;font-family:Pretendard,system-ui,sans-serif;
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.6}
.kb1 .sub b{color:var(--ink-2);font-weight:600}
.gsplit{display:flex;height:26px;border-radius:var(--r-sm);overflow:hidden;margin:0 0 8px;background:var(--rule)}
.gsplit i{display:flex;align-items:center;justify-content:center;font-family:"Geist Mono",ui-monospace,monospace;
  font-size:10.5px;font-weight:600;color:var(--bg1);white-space:nowrap;overflow:hidden}
.gkey{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 22px;font-size:11.5px;color:var(--ink-3)}
.gkey span{display:inline-flex;align-items:center;gap:5px}
.gkey i{width:9px;height:9px;border-radius:2px}
.gkey b{color:var(--ink);font-weight:600;font-family:"Geist Mono",ui-monospace,monospace}

.tm{position:relative;width:100%;border:1px solid var(--rule);
  border-radius:var(--r-md);overflow:hidden;background:var(--rule)}
.tmg{position:absolute;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
.tmh{flex:0 0 auto;padding:7px 10px 7px;min-width:0;
  background:var(--band);background:color-mix(in srgb,var(--gc,var(--rule)) 34%,var(--surface));
  border-bottom:1px solid var(--rule-2)}
.tmh .r1{display:flex;align-items:center;gap:6px;min-width:0}
.tmh i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.tmh .pc{flex:0 0 auto;font-family:Pretendard,system-ui,sans-serif;font-size:13px;font-weight:700;
  color:var(--gc);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tmh h4{margin:0;font-size:15px;font-weight:700;letter-spacing:-.025em;white-space:nowrap;
  transform-origin:left center;line-height:1.2;color:var(--ink)}
.tmh .r2{display:block;margin-top:2px;font-family:"Geist Mono",ui-monospace,monospace;font-size:10px;
  color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden}

.tmbar{display:flex;flex-flow:row wrap;column-gap:20px;row-gap:8px;align-items:center;margin:0 0 16px}.tmbar .r{position:relative}.tmbar .r+.r::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);height:14px;width:1px;background:var(--rule-2)}
.tmbar .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.fgrp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.tmbar .osel{font:inherit;font-size:12px;color:var(--ink);background:var(--sunk);
  border:1px solid var(--rule);border-radius:var(--r-sm);padding:3px 8px}
.tmb{position:relative;flex:1 1 auto;min-height:0}
.tmsub{position:absolute;overflow:hidden}
.tmsl{position:absolute;left:0;top:0;height:15px;font-weight:600;display:flex;align-items:center;padding:0 6px;
  font-family:Pretendard,system-ui,sans-serif;font-size:9px;letter-spacing:.04em;
  color:var(--th);z-index:1;pointer-events:none;white-space:nowrap;overflow:hidden;max-width:100%}
.tmt{position:absolute;border:0;margin:0;padding:6px 7px;font:inherit;text-align:left;color:var(--ink);
  cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:2px;
  outline:1px solid var(--surface);outline-offset:-1px;
  background:var(--sunk);background:color-mix(in srgb,var(--th) 13%,var(--surface))}
.tmt:hover{background:var(--band);background:color-mix(in srgb,var(--th) 26%,var(--surface))}
.tmt.sel{outline:2px solid var(--ink);outline-offset:-2px;z-index:2}
.tmt .kw{font-size:11.5px;font-weight:600;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.tmt .wh{font-size:10px;color:var(--ink-3);line-height:1.3;overflow-wrap:anywhere}
.tmt .ct{position:absolute;right:6px;bottom:5px;font-family:"Geist Mono",ui-monospace,monospace;
  font-size:9.5px;color:var(--ink-3)}
.tmlegend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11px;color:var(--ink-3)}

.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden}
.gcard{background:var(--surface);border:0;text-align:left;font:inherit;color:inherit;
  padding:13px 15px 14px;cursor:pointer;display:block;width:100%}
.gcard:hover{background:var(--sunk)}
.gc1{display:flex;align-items:baseline;gap:7px}
.gc1 i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;align-self:center}
.gc1 .nm{font-size:13.5px;font-weight:600;letter-spacing:-.01em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc1 .rs{margin-left:auto;font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;
  color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.gc1 .rs b{font-size:14px;font-weight:600;color:var(--ink)}
.gbar{height:6px;border-radius:3px;background:var(--rule);margin:9px 0 8px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px}
.gsub{font-family:"Geist Mono",ui-monospace,monospace;font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.gsub b{color:var(--ink-2);font-weight:600}
.gteams{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:9px;background:var(--rule)}
.gteams i{display:block;height:100%}
.gtl{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:10.5px;color:var(--ink-3)}
.gtl span{display:inline-flex;align-items:center;gap:4px}
.gtl i{width:7px;height:7px;border-radius:2px}


/* ── 상단 바 ── */
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--rule-2);overflow:hidden}
.top-r1{position:relative;z-index:2;background:var(--surface)}
.fbar{position:relative;z-index:1;
  transition:margin-top .24s cubic-bezier(.22,.61,.36,1),opacity .16s linear}
body.fold .fbar{margin-top:calc(0px - var(--fbH,0px));opacity:0;pointer-events:none}
.r2mix{gap:8px 20px;align-items:center}
.top-r2.r2mix>.frow{flex:0 1 auto}
.top-r2.r2mix>#f-sg .flab{min-width:0}

<script>
/* ── 부트스트랩 ──────────────────────────────────────────────
   data.json(암호화 가능) 과 basis.json 을 받아 앱을 띄운다. */
const $=id=>document.getElementById(id);
const gate=$("gate"), gmsg=$("gmsg");
const GCID="830037153887-18a8gh7nbeukd1rrsrb6vkt5l6uguf5i.apps.googleusercontent.com";
function say(t,ok){ gmsg.textContent=t; gmsg.className="gmsg"+(ok?" ok":""); }
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function decrypt(box,pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(box.salt),iterations:box.iter||250000,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(box.iv)},key,b64(box.ct));
  return new TextDecoder().decode(pt);
}
window.__unseal=decrypt;
window.__seal=async(objText,pw)=>{
  const enc=new TextEncoder();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(objText)));
  const b=u=>btoa(String.fromCharCode(...u));
  return JSON.stringify({enc:"AES-GCM",kdf:"PBKDF2-SHA256",iter:250000,
    salt:b(salt),iv:b(iv),ct:b(ct)},null,0);
};
let APP=null;
async function loadApp(pw){
  if(APP)return APP;
  if(pw){
    const r=await fetch("app.enc?t="+Date.now(),{cache:"no-store"});
    if(r.ok){ APP=JSON.parse(await decrypt(await r.json(),pw)); return APP; }
  }
  const r2=await fetch("app.json",{cache:"no-cache"});
  if(!r2.ok) throw new Error("앱 파일을 받지 못했습니다");
  APP=await r2.json(); return APP;
}
function boot(dataText,basis){
  $("data").textContent=dataText;
  const B={SIZE:{},GUESS:[],WDEF:{ftmul:basis.ft_multiplier||1.5,
            week:(basis.week_hours||40)/8, np:basis.nonproject_hours??8},
          BANDS:{},NPT:basis.nonproject_by_team||{}};
  const bd=basis.size_bands||{XS:2,S:5,M:10,L:18,XL:30};
  Object.entries(bd).forEach(([k,v])=>{B.BANDS[k]=[v,Math.max(0.5,+(v*0.6).toFixed(1)),+(v*1.35).toFixed(1)];});
  Object.entries(basis.tasks||{}).forEach(([k,v])=>{
    B.SIZE[k]=[v.size,v.hours]; if(v.provisional)B.GUESS.push(k);});
  window.__B=B;
  document.getElementById("shell").outerHTML=APP.html;
  gate.classList.add("off"); $("app").classList.remove("off");
  const sc=document.createElement("script");
  sc.textContent=APP.src;
  document.body.appendChild(sc);
}
(async()=>{
  try{ const c=await fetch("sync.json?"+Date.now(),{cache:"no-store"});
       if(c.ok) window.__SYNC=await c.json(); }catch(e){}
  let raw;
  try{
    const a=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    if(!a.ok) throw new Error("파일을 받지 못했습니다");
    window.__DTAG=a.headers.get("etag")||a.headers.get("last-modified")||"";
    raw=await a.json();
  }catch(e){ say("데이터를 불러오지 못했습니다 — "+e.message); return; }
  if(!raw.enc){                       // 평문(로컬 테스트)
    try{ await loadApp(null); }catch(e){ say("앱을 불러오지 못했습니다 — "+e.message); return; }
    boot(JSON.stringify(raw),raw.basis||{}); return;
  }
  const tryPw=async pw=>{
    try{ const txt=await decrypt(raw,pw);
         await loadApp(pw);
         window.__PW=pw;
         boot(txt,JSON.parse(txt).basis||{}); return true; }
    catch(e){ return false; }
  };
  // 세션 내 빠른 경로 — 이미 받은 키 재사용
  const savedKey=(()=>{try{return sessionStorage.getItem("pxd-key")||""}catch(e){return""}})();
  if(savedKey){
    try{ const m=JSON.parse(sessionStorage.getItem("pxd-me")||"{}");
         window.__ME_EMAIL=m.email; window.__KPI_OK=!!m.kpi; window.__ADMIN=!!m.admin; }catch(e){}
    if(await tryPw(savedKey)) return;
  }
  // 회사 계정 구글 로그인
  const AUTH=()=>(window.__SYNC&&window.__SYNC.url?window.__SYNC.url:"")+"/auth";
  window.__onCred=async(resp)=>{
    say("확인 중…",true);
    try{
      const r=await fetch(AUTH(),{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({credential:(resp&&resp.credential)||""})});
      if(r.status===403){ say("회사 계정(musinsa.com·29cm.co.kr)만 접근할 수 있습니다."); return; }
      if(!r.ok){ say("로그인 확인에 실패했습니다. 잠시 후 다시 시도하세요."); return; }
      const d=await r.json();
      if(!d.ok||!d.key){ say("접근 권한이 없습니다."); return; }
      window.__ME_EMAIL=d.email; window.__KPI_OK=!!d.kpi; window.__ADMIN=!!d.admin; window.__CRED=(resp&&resp.credential)||"";
      if(await tryPw(d.key)){
        try{ sessionStorage.setItem("pxd-key",d.key);
             sessionStorage.setItem("pxd-me",JSON.stringify({email:d.email,kpi:d.kpi,admin:d.admin})); }catch(e){}
      } else say("데이터를 여는 중 문제가 발생했습니다.");
    }catch(e){ say("로그인 중 오류가 발생했습니다."); }
  };
  /* ── 회사 구글 계정 로그인 (리디렉션 방식 — 서드파티 쿠키/FedCM 불필요) ── */
  const REDIR="https://marcshin-mss.github.io/design-roster/";
  const AUTHZ="https://accounts.google.com/o/oauth2/v2/auth";
  const rnd=()=>{const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a).map(x=>x.toString(16).padStart(2,"0")).join("");};
  const jwtPayload=t=>{try{const p=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}};
  function startLogin(){
    const nonce=rnd(); try{sessionStorage.setItem("pxd-nonce",nonce);}catch(e){}
    const p=new URLSearchParams({client_id:GCID,redirect_uri:REDIR,response_type:"id_token",scope:"openid email profile",nonce:nonce,prompt:"select_account"});
    location.href=AUTHZ+"?"+p.toString();
  }
  window.__startLogin=startLogin;
  /* 구글에서 돌아온 경우 : id_token 처리 */
  if(location.hash && location.hash.indexOf("id_token=")>=0){
    const hp=new URLSearchParams(location.hash.slice(1));
    const tok=hp.get("id_token");
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
    let want=""; try{want=sessionStorage.getItem("pxd-nonce")||"";}catch(e){}
    const pl=tok?jwtPayload(tok):null;
    if(tok && pl && (!want || pl.nonce===want)){ try{sessionStorage.removeItem("pxd-nonce");}catch(e){} say("확인 중…",true); window.__onCred({credential:tok}); return; }
    say("로그인 응답을 확인하지 못했습니다. 다시 시도해 주세요.");
  }
  /* 로그인 버튼 */
  (function renderLoginBtn(){
    const gb=document.getElementById("gbtn"); if(!gb) return;
    const b=document.createElement("button");
    b.type="button"; b.id="glogin";
    b.style.cssText="display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:15px;font-weight:600;color:#3c4043;background:#fff;border:1px solid #dadce0;border-radius:9px;padding:12px 22px;cursor:pointer;width:100%;box-sizing:border-box;transition:background .15s,box-shadow .15s";
    b.onmouseover=()=>{b.style.background="#f7f8f8";b.style.boxShadow="0 1px 2px rgba(60,64,67,.2)";};
    b.onmouseout=()=>{b.style.background="#fff";b.style.boxShadow="none";};
    b.innerHTML='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true" style="margin-right:10px;flex:none"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.9l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Google 계정으로 로그인</span>';
    b.onclick=startLogin;
    gb.innerHTML=""; gb.appendChild(b);
  })();
})();
</script>
